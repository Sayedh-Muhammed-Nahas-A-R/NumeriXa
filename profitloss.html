<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NumeriXa – Profit & Loss Calculator</title>

<style>
        .calculator {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            text-align: center;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #222;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: bold;
            transition: 0.3s ease;
        }

        button:hover {
            background: #00ffd5;
            color: black;
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #00ffd5;
            font-size: 1.05rem;
            line-height: 1.8;
            text-align: left;
        }

        .result-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .result-label {
            color: #ddd;
        }

        .result-value {
            font-weight: bold;
            color: #00ffd5;
        }

        .note {
            margin-top: 10px;
            text-align: center;
            font-size: 0.82rem;
            color: #ccc;
        }

        @media (max-width: 500px) {
            .calculator {
                max-width: 100%;
                padding: 18px;
            }

            .dashboard-heading {
                font-size: 2.2rem;
            }

            .back-btn {
                position: static;
                display: inline-block;
                margin-bottom: 15px;
            }

            .result {
                font-size: 1rem;
            }
        }
    </style>
  <link rel="stylesheet" href="theme.css">
</head>

<body>

    <div>

        <h1 class="dashboard-heading">NumeriXa</h1>

        <a href="dashboard.html" class="back-btn">
            Back to Dashboard
        </a>

        <div class="calculator">

            <h2>📈 Profit & Loss Calculator</h2>

            <input
                type="number"
                id="costPrice"
                placeholder="Cost Price (₹)"
                min="0"
                step="0.01"
            >

            <input
                type="number"
                id="sellingPrice"
                placeholder="Selling Price (₹)"
                min="0"
                step="0.01"
            >

            <button onclick="calculateProfitLoss()">
                Calculate
            </button>

            <button onclick="resetProfitLoss()">
                Reset
            </button>

            <div class="result" id="result"></div>

        </div>

    </div>

    <script>

        function calculateProfitLoss() {

            const costPrice =
                parseFloat(document.getElementById("costPrice").value);

            const sellingPrice =
                parseFloat(document.getElementById("sellingPrice").value);

            const result =
                document.getElementById("result");

            if (
                isNaN(costPrice) ||
                costPrice <= 0 ||
                isNaN(sellingPrice) ||
                sellingPrice < 0
            ) {

                result.innerHTML = `
                    <div class="result-title">
                        Please enter valid values.
                    </div>
                `;

                return;
            }

            const difference =
                sellingPrice - costPrice;

            let percentage;
            let status;

            if (difference > 0) {

                percentage =
                    (difference / costPrice) * 100;

                status = "Profit";

            }
            else if (difference < 0) {

                percentage =
                    (Math.abs(difference) / costPrice) * 100;

                status = "Loss";

            }
            else {

                percentage = 0;

                status = "No Profit / No Loss";

            }

            result.innerHTML = `

                <div class="result-title">
                    📊 ${status}
                </div>

                <div class="result-row">
                    <span class="result-label">
                        Cost Price:
                    </span>

                    <span class="result-value">
                        ₹${costPrice.toFixed(2)}
                    </span>
                </div>

                <div class="result-row">
                    <span class="result-label">
                        Selling Price:
                    </span>

                    <span class="result-value">
                        ₹${sellingPrice.toFixed(2)}
                    </span>
                </div>

                <div class="result-row">
                    <span class="result-label">
                        ${status === "Profit" ? "Profit" : status === "Loss" ? "Loss" : "Difference"}:
                    </span>

                    <span class="result-value">
                        ₹${Math.abs(difference).toFixed(2)}
                    </span>
                </div>

                <div class="result-row">
                    <span class="result-label">
                        Percentage:
                    </span>

                    <span class="result-value">
                        ${percentage.toFixed(2)}%
                    </span>
                </div>

                <div class="note">
                    Percentage is calculated using the Cost Price.
                </div>

            `;
        }

        function resetProfitLoss() {

            document.getElementById("costPrice").value = "";

            document.getElementById("sellingPrice").value = "";

            document.getElementById("result").innerHTML = "";

        }

    </script>

</body>

</html>
