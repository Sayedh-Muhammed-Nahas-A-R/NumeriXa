<!DOCTYPE html>
<html lang="en">

<head>
    <title>NumeriXa – Life Timeline</title>

    <link rel="stylesheet" href="all.css">
    <link rel="stylesheet" href="body.css">

    <style>
        .calculator {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: bold;
        }

        button:hover {
            background: #00ffd5;
            color: black;
        }

        .result {
            margin-top: 12px;
            color: #00ffd5;
            font-size: 1.05rem;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div>
    <h1 class="dashboard-heading">NumeriXa</h1>
    <a href="dashboard.html" class="back-btn">Back to Dashboard</a>

    <div class="calculator">

        <h2>Life Timeline</h2>

        <input type="date" id="dob">
        <input type="date" id="today">

        <button onclick="calculateLifeTimeline()">Calculate</button>
        <button onclick="resetLifeTimeline()">Reset</button>

        <div class="result" id="result"></div>

    </div>
</div>

<script>

document.getElementById("today").valueAsDate = new Date();

function getZodiac(day, month) {
    const signs = [
        ["Capricorn",19],["Aquarius",18],["Pisces",20],
        ["Aries",19],["Taurus",20],["Gemini",20],
        ["Cancer",22],["Leo",22],["Virgo",22],
        ["Libra",22],["Scorpio",21],["Sagittarius",21],["Capricorn",31]
    ];
    return day <= signs[month][1] ? signs[month][0] : signs[month+1][0];
}

function calculateLifeTimeline() {

    const dob = document.getElementById("dob").value;
    const today = document.getElementById("today").value;

    if (!dob || !today) {
        alert("Please select both dates.");
        return;
    }

    const birth = new Date(dob);
    const current = new Date(today);

    if (current < birth) {
        alert("Selected date must be after Date of Birth.");
        return;
    }

    let years = current.getFullYear() - birth.getFullYear();
    let months = current.getMonth() - birth.getMonth();
    let days = current.getDate() - birth.getDate();

    if (days < 0) {
        months--;
        days += new Date(current.getFullYear(), current.getMonth(), 0).getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    const totalDays = Math.floor((current - birth) / (1000 * 60 * 60 * 24));
    const totalWeeks = Math.floor(totalDays / 7);
    const totalMonths = years * 12 + months;

    const bornDay = birth.toLocaleDateString("en-US", { weekday: "long" });

    let nextBirthday = new Date(current.getFullYear(), birth.getMonth(), birth.getDate());

    if (nextBirthday < current) {
        nextBirthday.setFullYear(current.getFullYear() + 1);
    }

    const daysLeft = Math.ceil((nextBirthday - current) / (1000 * 60 * 60 * 24));

    const nextBirthdayText = nextBirthday.toLocaleDateString("en-US", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    const zodiac = getZodiac(birth.getDate(), birth.getMonth());

    document.getElementById("result").innerHTML = `
        <b>${years} Years ${months} Months ${days} Days</b><br><br>

        Born on: ${bornDay}<br>
        Total Months: ${totalMonths}<br>
        Total Weeks: ${totalWeeks}<br>
        Total Days: ${totalDays}<br><br>

        Next Birthday: ${nextBirthdayText}<br>
        Days Left: ${daysLeft}<br>
        Astro Sign: ${zodiac}
    `;
}

function resetLifeTimeline() {
    document.getElementById("dob").value = "";
    document.getElementById("today").valueAsDate = new Date();
    document.getElementById("result").innerHTML = "";
}

</script>

</body>
</html>
