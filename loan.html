<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NumeriXa – Loan Calculator</title>

<style>
        .calculator {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            text-align: center;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #222;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: bold;
            transition: 0.3s ease;
        }

        button:hover {
            background: #00ffd5;
            color: black;
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #00ffd5;
            font-size: 1.05rem;
            line-height: 1.8;
            text-align: left;
        }

        .result-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .result-label {
            color: #ddd;
        }

        .result-value {
            font-weight: bold;
            color: #00ffd5;
        }

        @media (max-width: 500px) {
            .calculator {
                max-width: 100%;
                padding: 18px;
            }

            .dashboard-heading {
                font-size: 2.2rem;
            }

            .back-btn {
                position: static;
                display: inline-block;
                margin-bottom: 15px;
            }

            .result {
                font-size: 1rem;
            }
        }
    </style>
  <link rel="stylesheet" href="theme.css">
</head>

<body>

    <div>

        <h1 class="dashboard-heading">NumeriXa</h1>

        <a href="dashboard.html" class="back-btn">
            Back to Dashboard
        </a>

        <div class="calculator">

            <h2>🏦 Loan Calculator</h2>

            <input
                type="number"
                id="amount"
                placeholder="Loan Amount (₹)"
                min="1"
                step="0.01"
            >

            <input
                type="number"
                id="rate"
                placeholder="Annual Interest Rate (%)"
                min="0"
                step="0.01"
            >

            <input
                type="number"
                id="years"
                placeholder="Loan Period (Years)"
                min="1"
                step="1"
            >

            <button onclick="calculateLoan()">
                Calculate
            </button>

            <button onclick="resetLoan()">
                Reset
            </button>

            <div class="result" id="result"></div>

        </div>

    </div>

    <script>

        function calculateLoan() {

            const amount =
                parseFloat(document.getElementById("amount").value);

            const rate =
                parseFloat(document.getElementById("rate").value);

            const years =
                parseFloat(document.getElementById("years").value);

            const result =
                document.getElementById("result");

            if (
                isNaN(amount) ||
                amount <= 0 ||
                isNaN(rate) ||
                rate < 0 ||
                isNaN(years) ||
                years <= 0
            ) {

                result.innerHTML = `
                    <div class="result-title">
                        Please enter valid values.
                    </div>
                `;

                return;
            }

            const months = years * 12;

            const monthlyRate = rate / 12 / 100;

            let emi;

            if (monthlyRate === 0) {

                emi = amount / months;

            } else {

                emi =
                    amount *
                    monthlyRate *
                    Math.pow(1 + monthlyRate, months) /
                    (Math.pow(1 + monthlyRate, months) - 1);

            }

            const totalPayment = emi * months;

            const totalInterest = totalPayment - amount;

            result.innerHTML = `

                <div class="result-title">
                    🏦 Loan Summary
                </div>

                <div class="result-row">
                    <span class="result-label">
                        Loan Amount:
                    </span>

                    <span class="result-value">
                        ₹${amount.toFixed(2)}
                    </span>
                </div>

                <div class="result-row">
                    <span class="result-label">
                        Monthly EMI:
                    </span>

                    <span class="result-value">
                        ₹${emi.toFixed(2)}
                    </span>
                </div>

                <div class="result-row">
                    <span class="result-label">
                        Total Interest:
                    </span>

                    <span class="result-value">
                        ₹${totalInterest.toFixed(2)}
                    </span>
                </div>

                <div class="result-row">
                    <span class="result-label">
                        Total Payment:
                    </span>

                    <span class="result-value">
                        ₹${totalPayment.toFixed(2)}
                    </span>
                </div>

                <div class="result-row">
                    <span class="result-label">
                        Loan Period:
                    </span>

                    <span class="result-value">
                        ${months} months
                    </span>
                </div>

            `;
        }

        function resetLoan() {

            document.getElementById("amount").value = "";

            document.getElementById("rate").value = "";

            document.getElementById("years").value = "";

            document.getElementById("result").innerHTML = "";

        }

    </script>

</body>

</html>
