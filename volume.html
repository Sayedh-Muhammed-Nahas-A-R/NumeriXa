<!DOCTYPE html>
<html lang="en">

<head>
    <title>NumeriXa – Volume Converter</title>

    <link rel="stylesheet" href="all.css">
    <link rel="stylesheet" href="body.css">

    <style>
        .calculator {
            max-width: 400px;
            width: 100%;
            background: rgba(255,255,255,.1);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,.4);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            text-align: center;
            background: rgba(255,255,255,.2);
            color: white;
            outline: none;
        }

        select option {
            background: #203a43;
            color: white;
        }

         input::placeholder {
            color: rgba(255, 255, 255, .7);
        }

        input:focus,
        select:focus {
            background: rgba(255, 255, 255, .3);
            box-shadow: 0 0 10px #00ffd5;
        }

        .swap-btn {
            width: 50px;
            height: 50px;
            margin: 8px auto;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,.2);
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            transition: .3s;
        }

        .swap-btn:hover {
            background: #00ffd5;
            color: black;
            transform: rotate(180deg);
        }

        button.action {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(255,255,255,.2);
            color: white;
            font-weight: bold;
        }

        button.action:hover {
            background: #00ffd5;
            color: black;
        }

        .result {
            margin-top: 18px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(0,255,213,.3);
        }

        .small {
            color: #b7dbe5;
            font-size: .95rem;
        }

        .big {
            color: #00ffd5;
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 8px;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div>

    <h1 class="dashboard-heading">NumeriXa</h1>

    <a href="unit.html" class="back-btn">Back to Unit Hub</a>

    <div class="calculator">

        <h2>Volume Converter</h2>

        <input type="number" id="value" placeholder="Enter volume" oninput="convertVolume()">

        <select id="from" onchange="convertVolume()">
            <option value="1">Liter (L)</option>
            <option value="0.001">Milliliter (mL)</option>
            <option value="3.785411784">Gallon (US)</option>
            <option value="0.946352946">Quart (US)</option>
            <option value="0.473176473">Pint (US)</option>
            <option value="0.2365882365">Cup (US)</option>
            <option value="1000">Cubic Meter (m³)</option>
        </select>

        <button class="swap-btn" onclick="swapUnits()">⇅</button>

        <select id="to" onchange="convertVolume()">
            <option value="0.001">Milliliter (mL)</option>
            <option value="1">Liter (L)</option>
            <option value="3.785411784">Gallon (US)</option>
            <option value="0.946352946">Quart (US)</option>
            <option value="0.473176473">Pint (US)</option>
            <option value="0.2365882365">Cup (US)</option>
            <option value="1000">Cubic Meter (m³)</option>
        </select>

        <button class="action" onclick="resetVolume()">Reset</button>

        <div class="result">
            <div class="small" id="preview">Converted volume will appear here</div>
            <div class="big" id="result">—</div>
        </div>

    </div>

</div>

<script>

function convertVolume(){

    const value = parseFloat(document.getElementById("value").value);

    if(isNaN(value)){
        document.getElementById("preview").innerHTML = "Enter a volume";
        document.getElementById("result").innerHTML = "—";
        return;
    }

    const from = document.getElementById("from");
    const to = document.getElementById("to");

    const fromFactor = parseFloat(from.value);
    const toFactor = parseFloat(to.value);

    const liters = value * fromFactor;
    const answer = liters / toFactor;

    document.getElementById("preview").innerHTML =
        `${value} ${from.options[from.selectedIndex].text}`;

    document.getElementById("result").innerHTML =
        `${Number(answer.toFixed(6)).toLocaleString()} ${to.options[to.selectedIndex].text}`;
}

function swapUnits(){

    const from = document.getElementById("from");
    const to = document.getElementById("to");

    const temp = from.selectedIndex;
    from.selectedIndex = to.selectedIndex;
    to.selectedIndex = temp;

    convertVolume();
}

function resetVolume(){

    document.getElementById("value").value = "";
    document.getElementById("from").selectedIndex = 0;
    document.getElementById("to").selectedIndex = 1;

    document.getElementById("preview").innerHTML = "Enter a volume";
    document.getElementById("result").innerHTML = "—";
}

</script>

</body>
</html>
